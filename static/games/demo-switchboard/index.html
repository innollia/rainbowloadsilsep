<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIRCUIT / 09</title>
<style>
:root{color-scheme:dark;--fg:#e5f5e8;--muted:#99b4b2;--line:#314c48;--lime:#b3f36a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 24%,#1b3c31 0%,#0b1319 55%,#080d10 100%);font:16px/1.5 system-ui,'Noto Sans KR',sans-serif;color:var(--fg);display:flex;align-items:center;justify-content:center;padding:20px}.game{width:min(100%,660px);text-align:center}.kicker{font:12px/2 monospace;letter-spacing:.24em;color:var(--lime)}h1{font:bold clamp(35px,8vw,62px)/1.1 system-ui;letter-spacing:-.08em;margin:9px 0 13px}.desc{color:var(--muted);font-size:14px;margin:0 auto 16px;max-width:440px}.meta{margin:0 auto 20px;display:flex;gap:12px;justify-content:center;align-items:center}.count{min-width:90px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#10221e;font:12px/1.6 monospace;color:#a8d7c3}.count b{color:#e8ffe7}.grid{width:min(88vw,310px);display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:0 auto}.tile{aspect-ratio:1;border:1px solid #38544f;border-radius:17px;background:linear-gradient(155deg,#1d3333,#102027);cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s,transform .12s}.tile:hover{transform:translateY(-2px);border-color:#83a879}.tile:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.bulb{width:33%;aspect-ratio:1;border-radius:50%;background:#28433d;box-shadow:inset 0 3px 7px #0b1a17;transition:all .15s}.tile.on{background:linear-gradient(155deg,#254c37,#173323);border-color:#779c5a}.tile.on .bulb{background:var(--lime);box-shadow:0 0 16px #a2ec70aa,0 0 38px #78ee6b5c}.footer{margin-top:21px}.message{color:#a4cfaa;min-height:33px;font-size:14px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:center}button.action{border:1px solid #436451;color:var(--fg);background:#142821;border-radius:10px;padding:12px 17px;font-weight:650;cursor:pointer}button.action.primary{background:var(--lime);color:#102015;border-color:var(--lime)}button.action:hover{filter:brightness(1.15)}.help{margin-top:22px;color:#708d88;font:11px/1.8 monospace}
</style></head><body>
<main class="game"><div class="kicker">ARCADE DEMO // REVERSE ENGINEERING</div><h1>CIRCUIT / 09</h1><p class="desc">한 칸을 누르면 그 칸과 상하좌우의 상태가 뒤집혀.<br>모든 회로를 켜. 움직임을 줄일수록 좋아.</p><div class="meta"><div class="count">STAGE <b id="stage">01</b></div><div class="count">MOVES <b id="moves">00</b></div></div><div class="grid" id="grid" role="group" aria-label="3×3 전구 퍼즐"></div><div class="footer"><div class="message" role="status" id="message">회로가 반응하기를 기다리는 중</div><div class="actions"><button class="action primary" id="next" hidden>다음 스테이지 ↗</button><button class="action" id="reset">처음으로</button><button class="action" id="reshuffle">새 배치</button></div><div class="help">ORIGINAL HTML SAMPLE · 이 폴더를 삭제하면 목록에서 자동 제거돼</div></div></main>
<script>
(()=>{'use strict';const grid=document.getElementById('grid'),movesEl=document.getElementById('moves'),stageEl=document.getElementById('stage'),message=document.getElementById('message'),next=document.getElementById('next');let state=Array(9).fill(true),startState=[],moves=0,stage=1,won=false;const buttons=[];const neighbors=i=>[i,i-3,i+3,...(i%3?[i-1]:[]),...(i%3!==2?[i+1]:[])].filter(x=>x>=0&&x<9);const flip=i=>neighbors(i).forEach(k=>state[k]=!state[k]);function paint(){state.forEach((on,i)=>{buttons[i].classList.toggle('on',on);buttons[i].setAttribute('aria-pressed',String(on));buttons[i].setAttribute('aria-label',`${Math.floor(i/3)+1}행 ${i%3+1}열 ${on?'켜짐':'꺼짐'}`)});movesEl.textContent=String(moves).padStart(2,'0');stageEl.textContent=String(stage).padStart(2,'0');next.hidden=!won;}function press(i){if(won)return;flip(i);moves++;won=state.every(Boolean);message.textContent=won?`회로 복구 성공 · ${moves}회 조작`:'회로 패턴을 분석하는 중';paint()}function newBoard(){won=false;moves=0;do{state=Array(9).fill(true);for(let n=0;n<Math.min(4+stage,12);n++)flip(Math.floor(Math.random()*9));}while(state.every(Boolean));startState=state.slice();message.textContent='모든 전구를 켜서 회로를 완성해.';paint()}for(let i=0;i<9;i++){const b=document.createElement('button');b.className='tile';b.type='button';b.innerHTML='<span class="bulb"></span>';b.addEventListener('click',()=>press(i));grid.appendChild(b);buttons.push(b)}document.getElementById('reset').addEventListener('click',()=>{state=startState.slice();moves=0;won=false;message.textContent='시작 배치로 되돌렸어.';paint()});document.getElementById('reshuffle').addEventListener('click',newBoard);next.addEventListener('click',()=>{stage++;newBoard()});newBoard()})();
</script></body></html>
