<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game sound assets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=c89a5a2e97">
</head>
<body>
<div id="app">
  <header>
    <button id="boardBack" class="iconBtn ghost" aria-label="Back to the board" title="Back to the board" data-i18n-aria="toBoard" data-i18n-title="toBoard"></button>
    <span id="gameTitle"></span>
    <div id="progress" role="group" aria-label="Progress"><div class="pads"></div></div>
    <span id="progressCount"></span>
    <span class="spacer"></span>
    <span id="detailNav"><button id="prevAsset" class="iconBtn ghost" aria-label="Previous" title="Previous" data-i18n-aria="prevAsset" data-i18n-title="prevAsset"></button><button id="nextAsset" class="iconBtn ghost" aria-label="Next" title="Next" data-i18n-aria="nextAsset" data-i18n-title="nextAsset"></button></span>
    <button id="importBtn" class="importBtn"><span class="importIco"></span><span data-i18n="importShort">Import</span></button>
    <button id="exportBtn" class="iconBtn" aria-label="Export" title="Export" data-i18n-aria="export" data-i18n-title="export"></button>
    <div class="menuWrap">
      <button id="menuBtn" class="iconBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Menu" title="Menu" data-i18n-aria="menu" data-i18n-title="menu"></button>
      <div id="menu" role="menu" hidden>
        <button role="menuitem" data-act="settings"><span class="icoSlot" data-icon="gear"></span><span data-i18n="settings">Settings</span></button>
        <button role="menuitem" data-act="spec"><span class="icoSlot" data-icon="spec"></span><span data-i18n="spec">Spec</span></button>
        <button role="menuitem" data-act="refs"><span class="icoSlot" data-icon="ref"></span><span data-i18n="refs">References</span></button>
        <button role="menuitem" data-act="game"><span class="icoSlot" data-icon="folder"></span><span data-i18n="gameInfo">Game info</span></button>
        <button role="menuitem" data-act="help"><span class="icoSlot" data-icon="help"></span><span data-i18n="help">How to use</span></button>
      </div>
    </div>
    <button id="backBtn" class="iconBtn" aria-label="To music studio" title="To music studio" data-i18n-aria="backToMusic" data-i18n-title="backToMusic"></button>
  </header>

  <main id="boardView">
    <nav id="side" aria-label="Category" data-i18n-aria="category"></nav>
    <section id="board" tabindex="-1" aria-label="Asset board" data-i18n-aria="board"></section>
  </main>

  <main id="detailView" hidden></main>

  <footer id="dock">
    <button id="playAll" class="iconBtn" aria-label="Play all" title="Play all" data-i18n-aria="playAll" data-i18n-title="playAll"></button>
    <span id="nowPlaying"></span>
    <div id="review" hidden>
      <span id="reviewText"></span>
      <button id="acceptAll" data-i18n="acceptAll">Keep all</button>
      <button id="rejectAll" class="ghost" data-i18n="rejectAll">Discard all</button>
    </div>
    <form id="askForm">
      <span id="selCount" hidden></span>
      <button id="selAll" type="button" class="ghost" hidden data-i18n="selectAll">Select all</button>
      <button id="selApprove" type="button" class="ghost" hidden data-i18n="approve">Approve</button>
      <button id="selClear" type="button" class="ghost" hidden data-i18n="clear">Clear</button>
      <span id="draftSlot"></span>
      <input id="ask" autocomplete="off" aria-label="Edit request" data-i18n-aria="ask">
      <button id="send" class="iconBtn" aria-label="Send" title="Send" data-i18n-aria="send" data-i18n-title="send"></button>
    </form>
  </footer>
</div>
<div id="lasso" hidden></div>
<div id="toast" role="status" hidden></div>
<dialog id="dialog"></dialog>
<div id="dropZone" hidden><div><span data-i18n="dropHere">Drop sound files, a folder or an exported bundle</span></div></div>
<input id="importFiles" type="file" multiple accept="audio/*,.wav,.mp3,.ogg,.zip,.json" hidden>
<input id="importFolder" type="file" webkitdirectory multiple hidden>
<script src="data.js?v=dd73f16fca"></script>
<script src="synth.js?v=c12ee441dc"></script>
<script src="importer.js?v=1e3e37c217"></script>
<script src="godot.js?v=c4e46569c2"></script>
<script src="unreal_py.js?v=f4cdafe908"></script>
<script src="unreal.js?v=277b868218"></script>
<script src="refs.js?v=d6b838fe2e"></script>
<script src="measure.js?v=4c4161f8c4"></script>
<script src="store.js?v=c0d9aff5cb"></script>
<script src="board.js?v=a6614f232e"></script>
<script src="gen.js?v=76fbc92bb0"></script>
<script src="sync.js?v=8e691d8227"></script>
<script src="quote.js?v=901b9dbc8c"></script>
<script src="app.js?v=d854c4b8f1"></script>
</body>
</html>
